<head>

    <style>
        :root {
            --bg-color: #060714;
            --glass-bg: rgba(10, 14, 40, 0.75);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f4ff;
            --text-muted: #7b8ab8;
            --accent: #38bdf8;
            --green: #4ade80;
            --yellow: #fbbf24;
            --red: #f87171;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Inter', sans-serif; color: var(--text-primary); background: var(--bg-color); }
        #3d-graph { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; pointer-events: auto; }
        header { position: absolute; top: 24px; left: 24px; pointer-events: none; }
        header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #dashboard-panel { position: absolute; top: 90px; left: 24px; width: 230px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-left: 3px solid transparent; }
        .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 800; }
        .legend { position: absolute; bottom: 30px; left: 24px; display: flex; flex-direction: column; gap: 8px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .legend-item .dot { width: 10px; height: 10px; border-radius: 50%; }
        #info-panel { position: absolute; top: 24px; right: 24px; width: 320px; max-height: calc(100vh - 48px); overflow-y: auto; transform: translateX(350px); transition: transform 0.5s ease; }
        #info-panel.visible { transform: translateX(0); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; margin-bottom: 12px; }
        .type-macro { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
        .resource-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; margin-bottom: 15px; max-height: 150px; overflow-y: auto; }
        .resource-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; font-size: 12px; text-decoration: none; color: var(--text-primary); cursor: pointer; }
        .resource-item:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .play-btn { color: var(--green); opacity: 0.6; transition: 0.2s; display: flex; align-items: center; }
        .play-btn:hover { opacity: 1; transform: scale(1.2); }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .action-btn { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .action-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .loader-ring { width: 60px; height: 60px; border: 4px solid rgba(56, 189, 248, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; }
        .toast { background: var(--glass-bg); border: 1px solid var(--accent); padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    </style>
</head>

            <div id="node-resources" class="resource-list" style="display: none;"></div>

                </div>
            </div>
        </div>

    <script>
        const GRAPH_DATA = {"nodes": [{"id": "m1", "next_best": false, "type": "macro", "label": "Tổng quan về Thương mại điện tử", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "m2", "next_best": false, "type": "macro", "label": "Giao dịch điện tử", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "m3", "next_best": false, "type": "macro", "label": "Marketing điện tử", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "m4", "next_best": false, "type": "macro", "label": "An toàn thông tin trong Thương mại điện tử", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "m5", "next_best": false, "type": "macro", "label": "Ứng dụng Thương mại điện tử trong Doanh nghiệp", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "c1.1", "next_best": true, "type": "micro", "label": "Khái niệm chung về TMĐT", "content": "Bài học này giới thiệu các định nghĩa cơ bản về Thương mại điện tử (TMĐT). Sinh viên sẽ hiểu được vai trò và tầm quan trọng của TMĐT trong kinh doanh hiện đại. Đồng thời, bài học cung cấp cái nhìn tổng quan về lĩnh vực đang phát triển mạnh mẽ này.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.2", "next_best": false, "type": "micro", "label": "Đặc điểm và phân loại TMĐT", "content": "Nội dung này mô tả các đặc điểm nổi bật của hoạt động TMĐT như tính toàn cầu, tương tác cao và chi phí thấp. Bài học cũng trình bày các cách phân loại TMĐT dựa trên đối tượng giao dịch hoặc hình thức hoạt động. Việc nắm vững các đặc điểm giúp hiểu rõ bản chất của TMĐT.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.3", "next_best": false, "type": "micro", "label": "Lợi ích và hạn chế của TMĐT", "content": "Bài học phân tích những ưu điểm mà TMĐT mang lại cho doanh nghiệp và người tiêu dùng, bao gồm mở rộng thị trường và tiết kiệm chi phí. Đồng thời, nó nêu rõ các thách thức và hạn chế tồn tại trong môi trường TMĐT. Sinh viên sẽ có cái nhìn đa chiều về lĩnh vực này.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.4", "next_best": false, "type": "micro", "label": "Sự phát triển của TMĐT và ảnh hưởng của TMĐT đến các lĩnh vực khác", "content": "Bài học tổng quan về lịch sử hình thành và các giai đoạn phát triển của TMĐT. Sinh viên sẽ đánh giá tác động của TMĐT đến các ngành nghề truyền thống, kinh tế, xã hội và văn hóa. Nội dung giúp hiểu bối cảnh và xu hướng phát triển của TMĐT.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.5", "next_best": false, "type": "micro", "label": "Cơ sở hạ tầng cho Thương mại điện tử", "content": "Nội dung này giới thiệu các yếu tố nền tảng cần thiết cho hoạt động TMĐT. Bao gồm hạ tầng pháp lý, công nghệ thông tin, thanh toán điện tử, an toàn thông tin, nhân lực và dịch vụ phân phối. Việc hiểu rõ các thành phần này là quan trọng để triển khai TMĐT hiệu quả.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.6", "next_best": false, "type": "micro", "label": "Các mô hình kinh doanh TMĐT", "content": "Bài học trình bày các mô hình TMĐT phổ biến như B2C (Doanh nghiệp – Người tiêu dùng), B2B (Doanh nghiệp – Doanh nghiệp), C2C (Cá nhân – Cá nhân) và C2B (Cá nhân – Doanh nghiệp). Sinh viên sẽ phân tích đặc điểm và ví dụ của từng mô hình, giúp lựa chọn mô hình phù hợp cho doanh nghiệp.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.7", "next_best": false, "type": "micro", "label": "Sàn giao dịch TMĐT", "content": "Nội dung này khái quát về sàn giao dịch điện tử, bao gồm định nghĩa, đặc trưng, phân loại và lợi ích. Bài học cũng nêu các phương thức giao dịch trên sàn TMĐT và quy trình đăng ký. Sinh viên sẽ hiểu cách hoạt động của các sàn giao dịch trực tuyến lớn.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c2.1", "next_best": false, "type": "micro", "label": "Hợp đồng điện tử", "content": "Bài học định nghĩa và phân tích đặc điểm của hợp đồng điện tử. Sinh viên sẽ nắm vững quy trình giao kết và thực hiện hợp đồng điện tử. Ngoài ra, bài học cũng đề cập đến những lưu ý quan trọng khi sử dụng loại hợp đồng này để đảm bảo tính pháp lý và an toàn.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c2.2", "next_best": false, "type": "micro", "label": "Thanh toán điện tử", "content": "Nội dung này giới thiệu khái niệm, yêu cầu của hệ thống thanh toán điện tử và phân biệt với thanh toán trong TMĐT. Bài học trình bày các phương thức thanh toán điện tử phổ biến hiện nay như ví điện tử, chuyển khoản trực tuyến. Sinh viên sẽ hiểu cơ chế hoạt động của các hình thức thanh toán số.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c2.3", "next_best": false, "type": "micro", "label": "Chữ ký số và chứng thực chữ ký số", "content": "Bài học giải thích đặc điểm, ưu điểm và quy trình sử dụng chữ ký số. Sinh viên sẽ hiểu rõ vai trò của dịch vụ chứng thực chữ ký số trong việc đảm bảo tính pháp lý và an toàn cho giao dịch điện tử. Nội dung này quan trọng trong việc xây dựng niềm tin trên môi trường số.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction"
