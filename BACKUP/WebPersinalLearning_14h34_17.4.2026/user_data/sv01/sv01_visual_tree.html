<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Tree 3D Visualizer</title>
    <!-- Thư viện 3D Force Graph WebGL -->
    <script src="//unpkg.com/3d-force-graph"></script>
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --glass-bg: rgba(22, 27, 34, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #58a6ff;
        }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-primary);
        }
        #3d-graph {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 1;
        }
        #ui-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 24px; pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        header {
            position: absolute; top: 30px; left: 40px; pointer-events: auto;
        }
        header h1 {
            margin: 0; font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #00ffcc, #58a6ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        header .subtitle {
            margin-top: 5px; color: var(--text-muted); font-size: 14px; font-weight: 500;
        }
        .search-box {
            position: absolute; top: 40px; right: 40px;
            display: flex; align-items: center;
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 50px;
            padding: 8px 20px; pointer-events: auto; transition: all 0.3s ease;
        }
        .search-box:focus-within {
            border-color: var(--accent); box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }
        .search-box input {
            background: transparent; border: none; color: white;
            font-family: 'Inter', sans-serif; font-size: 15px; width: 250px; outline: none;
        }
        .search-box input::placeholder { color: #666; }
        .search-box button {
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .search-box button:hover { color: var(--text-primary); }
        
        #info-panel {
            position: absolute; bottom: 40px; right: 40px; width: 320px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        #info-panel.hidden { transform: translateY(20px) scale(0.95); opacity: 0; pointer-events: none; }
        #info-panel h2 { margin: 0 0 10px 0; font-size: 22px; font-weight: 600; }
        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 6px;
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 15px;
        }
        .type-macro { background: rgba(0, 255, 204, 0.15); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.3); }
        .type-micro { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid rgba(255, 170, 0, 0.3); }
        .type-assess { background: rgba(255, 51, 102, 0.15); color: #ff3366; border: 1px solid rgba(255, 51, 102, 0.3); }
        #info-meta { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
        #info-desc {
            font-size: 14px; line-height: 1.6; color: #c9d1d9;
            max-height: 150px; overflow-y: auto; margin-bottom: 20px;
        }
        .legend {
            position: absolute; bottom: 40px; left: 40px;
            display: flex; flex-direction: column; gap: 12px; pointer-events: auto;
        }
        .legend-item { display: flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--text-muted); }
        .legend-item .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 12px; box-shadow: 0 0 8px currentColor; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <header>
            <h1>Knowledge Galaxy</h1>
            <p class="subtitle">Thương mại điện tử &bull; Đồ thị Không Gian Tri Thức</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm kiếm bài học, chương...">
            <button id="searchBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <div id="info-panel" class="hidden">
            <h2 id="info-title">Tiêu đề Node</h2>
            <div class="badge" id="info-type">Loại</div>
            <div class="meta" id="info-meta"></div>
            <p id="info-desc">Nội dung chi tiết sẽ xuất hiện ở đây...</p>
        </div>
        
        <div class="legend glass-panel">
            <div class="legend-item"><span class="dot" style="background:#00ffcc"></span> Chương (Macro)</div>
            <div class="legend-item"><span class="dot" style="background:#ffaa00"></span> Bài học (Micro)</div>
            <div class="legend-item"><span class="dot" style="background:#ff3366"></span> Bài tập (Assess)</div>
        </div>
    </div>

    <div id="3d-graph"></div>

    <script>
        const GRAPH_DATA = {"nodes": [{"id": "m1", "type": "macro", "label": "Tổng quan về Thương mại điện tử", "color": "#00ffcc", "val": 25}, {"id": "m2", "type": "macro", "label": "Giao dịch điện tử", "color": "#00ffcc", "val": 25}, {"id": "m3", "type": "macro", "label": "Marketing điện tử", "color": "#00ffcc", "val": 25}, {"id": "m4", "type": "macro", "label": "An toàn thông tin trong Thương mại điện tử", "color": "#00ffcc", "val": 25}, {"id": "m5", "type": "macro", "label": "Ứng dụng Thương mại điện tử trong doanh nghiệp", "color": "#00ffcc", "val": 25}, {"id": "c1.1", "type": "micro", "label": "Khái niệm chung về Thương mại điện tử", "content": "Thương mại điện tử (TMĐT) là hình thức mua bán hàng hóa và dịch vụ thông qua mạng internet. Nó bao gồm các giao dịch điện tử giữa doanh nghiệp với doanh nghiệp (B2B), doanh nghiệp với người tiêu dùng (B2C), và người tiêu dùng với người tiêu dùng (C2C). TMĐT mang lại sự tiện lợi, đa dạng sản phẩm và khả năng tiếp cận thị trường toàn cầu cho cả người bán và người mua.", "alpha_base": 12, "color": "#ffaa00", "val": 12}, {"id": "c1.2", "type": "micro", "label": "Đặc điểm và phân loại Thương mại điện tử", "content": "TMĐT có đặc điểm nổi bật là không giới hạn không gian, thời gian, tính tương tác cao và khả năng cá nhân hóa. Nó có thể được phân loại dựa trên đối tượng giao dịch (B2B, B2C, C2C, C2B, G2C, G2B) hoặc mức độ số hóa của sản phẩm/quy trình. Việc hiểu rõ các đặc điểm và phân loại giúp doanh nghiệp lựa chọn mô hình phù hợp.", "alpha_base": 14, "color": "#ffaa00", "val": 14}, {"id": "c1.3", "type": "micro", "label": "Lợi ích và hạn chế của Thương mại điện tử", "content": "Lợi ích của TMĐT bao gồm giảm chi phí, tăng doanh số, mở rộng thị trường và cải thiện dịch vụ khách hàng. Tuy nhiên, TMĐT cũng đối mặt với nhiều hạn chế như vấn đề bảo mật, rủi ro lừa đảo, chi phí đầu tư ban đầu cao và yêu cầu về hạ tầng công nghệ. Cân bằng giữa lợi ích và hạn chế là yếu tố quan trọng để phát triển TMĐT bền vững.", "alpha_base": 13, "color": "#ffaa00", "val": 13}, {"id": "c1.4", "type": "micro", "label": "Sự phát triển và ảnh hưởng của Thương mại điện tử", "content": "TMĐT đã trải qua quá trình phát triển mạnh mẽ nhờ sự tiến bộ của công nghệ thông tin và internet. Nó đã tạo ra những thay đổi sâu rộng trong các lĩnh vực kinh tế, xã hội, văn hóa và giáo dục. Từ việc thay đổi thói quen mua sắm đến hình thành các mô hình kinh doanh mới, TMĐT liên tục định hình lại cách chúng ta tương tác và giao dịch.", "alpha_base": 15, "color": "#ffaa00", "val": 15}, {"id": "c1.5", "type": "micro", "label": "Cơ sở hạ tầng cho Thương mại điện tử", "content": "Cơ sở hạ tầng cho TMĐT bao gồm nhiều yếu tố như hạ tầng pháp lý, công nghệ thông tin, thanh toán điện tử, an toàn thông tin, nhân lực và dịch vụ phân phối. Một hệ thống hạ tầng vững chắc là nền tảng thiết yếu để các hoạt động TMĐT diễn ra suôn sẻ và hiệu quả. Thiếu bất kỳ yếu tố nào cũng có thể gây cản trở sự phát triển của TMĐT.", "alpha_base": 18, "color": "#ffaa00", "val": 18}, {"id": "c1.6", "type": "micro", "label": "Các mô hình kinh doanh Thương mại điện tử", "content": "Có nhiều mô hình kinh doanh TMĐT phổ biến như B2C (doanh nghiệp đến người tiêu dùng), B2B (doanh nghiệp đến doanh nghiệp), C2C (người tiêu dùng đến người tiêu dùng), và C2B (người tiêu dùng đến doanh nghiệp). Mỗi mô hình có đặc điểm, ưu nhược điểm và yêu cầu riêng biệt về chiến lược marketing và vận hành. Việc lựa chọn mô hình phù hợp giúp doanh nghiệp tối ưu hóa hiệu quả kinh doanh.", "alpha_base": 17, "color": "#ffaa00", "val": 17}, {"id": "c1.7", "type": "micro", "label": "Sàn giao dịch Thương mại điện tử", "content": "Sàn giao dịch TMĐT là một nền tảng trực tuyến nơi người bán và người mua có thể gặp gỡ, trao đổi và thực hiện các giao dịch hàng hóa/dịch vụ. Các sàn này cung cấp cơ chế hỗ trợ thanh toán, vận chuyển và giải quyết tranh chấp. Lợi ích của sàn TMĐT bao gồm tiếp cận lượng khách hàng lớn, giảm chi phí marketing và tăng cường sự tin cậy.", "alpha_base": 16, "color": "#ffaa00", "val": 16}, {"id": "c2.1", "type": "micro", "label": "Hợp đồng điện tử", "content": "Hợp đồng điện tử là thỏa thuận được xác lập dưới dạng thông điệp dữ liệu, có giá trị pháp lý tương đương hợp đồng truyền thống. Nó bao gồm khái niệm, đặc điểm, quy trình giao kết và thực hiện. Khi sử dụng hợp đồng điện tử, các bên cần lưu ý về chữ ký số, chứng thực và các quy định pháp lý để đảm bảo tính hợp lệ và an toàn của giao dịch.", "alpha_base": 20, "color": "#ffaa00", "val": 20}, {"id": "c2.2", "type": "micro", "label": "Thanh toán điện tử", "content": "Thanh toán điện tử là quá trình chuyển tiền hoặc giá trị thông qua mạng điện tử, thay vì tiền mặt hay séc truyền thống. Các yêu cầu của hệ thống thanh toán điện tử bao gồm bảo mật, tốc độ và tính tiện lợi. Các phương thức phổ biến bao gồm thẻ tín dụng/ghi nợ, ví điện tử, chuyển khoản ngân hàng và cổng thanh toán trực tuyến.", "alpha_base": 19, "color": "#ffaa00", "val": 19}, {"id": "c2.3", "type": "micro", "label": "Chữ ký số và chứng thực chữ ký số", "content": "Chữ ký số là một dạng chữ ký điện tử được tạo ra bằng kỹ thuật mã hóa khóa công khai, dùng để xác thực danh tính người ký và đảm bảo tính toàn vẹn của dữ liệu. Chứng thực chữ ký số là quá trình xác nhận tính hợp lệ của chữ ký số bởi một tổ chức đáng tin cậy. Chữ ký số đóng vai trò quan trọng trong việc bảo đảm an toàn và pháp lý cho các giao dịch điện tử.", "alpha_base": 22, "color": "#ffaa00", "val": 22}, {"id": "c3.1", "type": "micro", "label": "Khái niệm cơ bản về Marketing điện tử", "content": "Marketing điện tử (e-marketing) là việc ứng dụng công nghệ thông tin và internet vào các hoạt động marketing để đạt được mục tiêu kinh doanh. Nó bao gồm các chiến lược thu hút, tương tác và duy trì khách hàng trên môi trường số. E-marketing tận dụng các kênh trực tuyến để truyền tải thông điệp và xây dựng thương hiệu.", "alpha_base": 15, "color": "#ffaa00", "val": 15}, {"id": "c3.2", "type": "micro", "label": "Người tiêu dùng trong môi trường điện tử", "content": "Người tiêu dùng trong môi trường điện tử có hành vi và kỳ vọng khác biệt so với kênh truyền thống, đòi hỏi doanh nghiệp phải hiểu rõ để tiếp cận hiệu quả. Họ thường tìm kiếm thông tin, so sánh sản phẩm và chia sẻ trải nghiệm trực tuyến. Việc phân tích hành vi khách hàng số giúp tối ưu hóa chiến lược e-marketing và cá nhân hóa trải nghiệm mua sắm.", "alpha_base": 18, "color": "#ffaa00", "val": 18}, {"id": "c3.3", "type": "micro", "label": "Nghiên cứu thị trường điện tử", "content": "Nghiên cứu thị trường điện tử là quá trình thu thập, phân tích dữ liệu về khách hàng, đối thủ cạnh tranh và xu hướng thị trường trên nền tảng số. Các phương pháp bao gồm khảo sát trực tuyến, phân tích dữ liệu website, mạng xã hội và công cụ tìm kiếm. Kết quả nghiên cứu giúp doanh nghiệp đưa ra quyết định chiến lược marketing hiệu quả và kịp thời.", "alpha_base": 20, "color": "#ffaa00", "val": 20}, {"id": "c3.4", "type": "micro", "label": "Các công cụ Marketing điện tử", "content": "Các công cụ marketing điện tử đa dạng bao gồm marketing qua công cụ tìm kiếm (SEO/SEM), marketing qua mạng xã hội, email marketing, marketing di động, marketing liên kết và marketing nội dung. Mỗi công cụ có ưu điểm riêng và cần được tích hợp linh hoạt để tạo ra chiến dịch tổng thể. Việc vận dụng thành thạo các công cụ này giúp doanh nghiệp tiếp cận khách hàng mục tiêu hiệu quả.", "alpha_base": 25, "color": "#ffaa00", "val": 25}, {"id": "c3.5", "type": "micro", "label": "Đo lường trong Marketing điện tử", "content": "Đo lường trong marketing điện tử là quá trình theo dõi và đánh giá hiệu quả của các chiến dịch marketing thông qua các chỉ số cụ thể. Các chỉ số quan trọng bao gồm lưu lượng truy cập, tỷ lệ chuyển đổi, chi phí trên mỗi lượt nhấp (CPC) và lợi tức đầu tư (ROI). Việc đo lường giúp tối ưu hóa chiến lược, phân bổ ngân sách hợp lý và cải thiện hiệu suất tổng thể của hoạt động e-marketing.", "alpha_base": 24, "color": "#ffaa00", "val": 24}, {"id": "c4.1", "type": "micro", "label": "Vấn đề an ninh và rủi ro trong TMĐT", "content": "An ninh trong TMĐT đối mặt với nhiều thách thức như tấn công mạng, lừa đảo, mất cắp dữ liệu cá nhân và thông tin thanh toán. Các rủi ro này có thể gây thiệt hại lớn về tài chính và uy tín cho doanh nghiệp và người tiêu dùng. Nhận biết và hiểu rõ các nguy cơ là bước đầu tiên để xây dựng một môi trường TMĐT an toàn.", "alpha_base": 23, "color": "#ffaa00", "val": 23}, {"id": "c4.2", "type": "micro", "label": "Giải pháp an toàn thông tin trong TMĐT", "content": "Để bảo vệ an toàn thông tin trong TMĐT, cần áp dụng các giải pháp như mã hóa dữ liệu (SSL/TLS), sử dụng tường lửa, hệ thống phát hiện xâm nhập, xác thực đa yếu tố và chính sách bảo mật chặt chẽ. Ngoài ra, việc nâng cao nhận thức người dùng và tuân thủ các quy định pháp lý về bảo mật cũng rất quan trọng. Các giải pháp này giúp giảm thiểu rủi ro và tăng cường sự tin cậy trong giao dịch trực tuyến.", "alpha_base": 28, "color": "#ffaa00", "val": 28}, {"id": "c5.1", "type": "micro", "label": "Phát triển hệ thống Thương mại điện tử doanh nghiệp", "content": "Phát triển hệ thống TMĐT cho doanh nghiệp bao gồm việc lựa chọn nền tảng, thiết kế giao diện, tích hợp các chức năng (quản lý sản phẩm, đơn hàng, thanh toán) và triển khai chiến lược marketing. Quá trình này đòi hỏi sự phân tích kỹ lưỡng môi trường kinh doanh và khả năng tùy chỉnh để phù hợp với mục tiêu cụ thể của doanh nghiệp. Mục tiêu là xây dựng một hệ thống hoạt động hiệu quả và bền vững.", "alpha_base": 27, "color": "#ffaa00", "val": 27}, {"id": "c5.2", "type": "micro", "label": "Lập kế hoạch kinh doanh điện tử", "content": "Lập kế hoạch kinh doanh điện tử là quá trình phác thảo các mục tiêu, chiến lược và hoạt động cần thiết để thành công trong môi trường TMĐT. Kế hoạch này bao gồm phân tích thị trường, xác định đối tượng khách hàng, mô hình doanh thu, chiến lược marketing và dự báo tài chính. Một kế hoạch kinh doanh điện tử chi tiết giúp doanh nghiệp định hướng và tối ưu hóa nguồn lực.", "alpha_base": 29, "color": "#ffaa00", "val":         document.addEventListener('DOMContentLoaded', () => {
            const graphElem = document.getElementById('3d-graph');
            
            const Graph = ForceGraph3D()(graphElem)
                .backgroundColor('#0d1117')
                .nodeLabel('label')
                .nodeColor(node => node.color || '#ffffff')
                .nodeVal('val')
                .linkDirectionalArrowLength(3.5)
                .linkDirectionalArrowRelPos(1)
                .linkColor(() => 'rgba(255,255,255,0.2)')
                .linkWidth(0.5)
                .graphData(GRAPH_DATA)
                .onNodeClick(node => handleNodeClick(node))
                .onNodeHover(node => {
                    graphElem.style.cursor = node ? 'pointer' : null;
                });

            const panel = document.getElementById('info-panel');
            const pTitle = document.getElementById('info-title');
            const pType = document.getElementById('info-type');
            const pMeta = document.getElementById('info-meta');
            const pDesc = document.getElementById('info-desc');

            function handleNodeClick(node) {
                const distance = 80;
                const distRatio = 1 + distance/Math.hypot(node.x || Math.random(), node.y || Math.random(), node.z || Math.random());
                
                Graph.cameraPosition(
                    { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, 
                    node, 1500
                );
                
                panel.classList.add('glass-panel');
                pTitle.innerText = node.label || 'Không có tiêu đề';
                
                pType.className = 'badge'; 
                if(node.type === 'macro') {
                    pType.classList.add('type-macro'); pType.innerText = "CHƯƠNG KIẾN THỨC";
                    pMeta.innerText = "Mã Node: " + node.id;
                    pDesc.innerText = "Đây là một chương (mục) lớn của môn học.";
                } else if(node.type === 'micro') {
                    pType.classList.add('type-micro'); pType.innerText = "BÀI HỌC QUAN TRỌNG";
                    pMeta.innerText = "Trọng lượng Kiến thức: " + (node.alpha_base || '--');
                    pDesc.innerText = node.content || "Chưa có nội dung chi tiết cho bài học này.";
                } else if(node.type === 'assess') {
                    pType.classList.add('type-assess'); pType.innerText = "BÀI KIỂM TRA ĐÁNH GIÁ";
                    pMeta.innerText = "Ngưỡng đạt (Theta): " + (node.theta_pass || '--');
                    pDesc.innerText = "Bài kiểm tra này dùng để đánh giá năng lực của bạn trong node " + (node.id).replace('a', 'c') + ".";
                }

                panel.classList.remove('hidden');
            }

            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            function doSearch() {
                const query = searchInput.value.toLowerCase().trim();
                if(!query) return;

                const target = GRAPH_DATA.nodes.find(n => (n.label || '').toLowerCase().includes(query));
                if(target) {
                    handleNodeClick(target);
                } else {
                    alert("Không tìm thấy kết quả nào trùng khớp với từ khóa của bạn!");
                }
            }

            searchBtn.addEventListener('click', doSearch);
            searchInput.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') doSearch();
            });
        });
