<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Galaxy 3D — PKT Bio-Tutor</title>
    <script src="https://unpkg.com/three@0.141.0/build/three.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1.70.16/dist/3d-force-graph.min.js"></script>
                            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060714;
            --glass-bg: rgba(10, 14, 40, 0.75);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f4ff;
            --text-muted: #7b8ab8;
            --accent: #38bdf8;
            --green: #4ade80;
            --yellow: #fbbf24;
            --red: #f87171;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Inter', sans-serif; color: var(--text-primary); background: var(--bg-color); }
        #3d-graph { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; pointer-events: auto; }
        header { position: absolute; top: 24px; left: 24px; pointer-events: none; }
        header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #dashboard-panel { position: absolute; top: 90px; left: 24px; width: 230px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-left: 3px solid transparent; }
        .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 800; }
        .legend { position: absolute; bottom: 30px; left: 24px; display: flex; flex-direction: column; gap: 8px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .legend-item .dot { width: 10px; height: 10px; border-radius: 50%; }
        #info-panel { position: absolute; top: 24px; right: 24px; width: 320px; max-height: calc(100vh - 48px); overflow-y: auto; transform: translateX(350px); transition: transform 0.5s ease; }
        #info-panel.visible { transform: translateX(0); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; margin-bottom: 12px; }
        .type-macro { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
        .resource-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; margin-bottom: 15px; max-height: 150px; overflow-y: auto; }
        .resource-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; font-size: 12px; text-decoration: none; color: var(--text-primary); cursor: pointer; }
        .resource-item:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .play-btn { color: var(--green); opacity: 0.6; transition: 0.2s; display: flex; align-items: center; }
        .play-btn:hover { opacity: 1; transform: scale(1.2); }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .action-btn { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .action-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .loader-ring { width: 60px; height: 60px; border: 4px solid rgba(56, 189, 248, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; }
        .toast { background: var(--glass-bg); border: 1px solid var(--accent); padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="loading-screen"><div class="loader-ring"></div><div style="margin-top: 20px; color: var(--accent);">GALAXY BOOTING...</div></div>
    <div id="3d-graph"></div>
    <div id="ui-overlay">
        <header><h1>Knowledge Galaxy</h1></header>
        <div id="dashboard-panel" class="glass-panel">
            <div class="stat-card" style="border-left-color: var(--green)"><span class="stat-label">MASTERED</span><span class="stat-value" id="stat-mastered">0</span></div>
            <div class="stat-card" style="border-left-color: var(--yellow)"><span class="stat-label">LEARNING</span><span class="stat-value" id="stat-learning">0</span></div>
            <div class="stat-card" style="border-left-color: var(--red)"><span class="stat-label">WEAK</span><span class="stat-value" id="stat-weak">0</span></div>
        </div>
        <div class="legend glass-panel">
            <div class="legend-item"><span class="dot" style="background:var(--accent)"></span> Chương / Topic</div>
            <div class="legend-item"><span class="dot" style="background:var(--green)"></span> Mastered (&gt;80%)</div>
            <div class="legend-item"><span class="dot" style="background:var(--yellow)"></span> Developing</div>
            <div class="legend-item"><span class="dot" style="background:var(--red)"></span> Weak Point</div>
        </div>
        <div id="info-panel" class="glass-panel">
            <div id="info-type" class="badge type-macro">SELECT A NODE</div>
            <h2 id="info-title">Star Map</h2>
            <p id="info-desc">Select a node to view details and start learning journey.</p>
            <div id="node-resources" class="resource-list" style="display: none;"></div>
            <div id="action-buttons" style="display: none;">
                <div class="action-grid">
                    <div class="action-btn" onclick="startAction('video')">📺 VIDEO</div>
                    <div class="action-btn" onclick="startAction('quiz')">📝 QUIZ</div>
                    <div class="action-btn" onclick="startAction('ai_tutor')">🤖 AI TUTOR</div>
                    <div class="action-btn" onclick="startAction('flashcard')">📇 FLASHCARDS</div>
                </div>
            </div>
        </div>
        <div id="toast-container"></div>
    </div>
    <script>
        const GRAPH_DATA = {"nodes": [{"id": "m1", "next_best": false, "type": "macro", "label": "Khai thác dữ liệu và thông tin", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m2", "next_best": false, "type": "macro", "label": "Giao tiếp và hợp tác trong môi trường số", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m3", "next_best": false, "type": "macro", "label": "Sáng tạo nội dung số", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m4", "next_best": false, "type": "macro", "label": "An toàn Không gian số", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m5", "next_best": false, "type": "macro", "label": "Giải quyết vấn đề bằng công nghệ", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m6", "next_best": false, "type": "macro", "label": "Nhập môn Trí tuệ Nhân tạo (AI)", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m7", "next_best": false, "type": "macro", "label": "Thực hành Word & Tích hợp AI (Buổi 6-9)", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m8", "next_best": false, "type": "macro", "label": "Thực hành Excel & Tích hợp AI (Buổi 10-12)", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m9", "next_best": false, "type": "macro", "label": "Thực hành PowerPoint & Tích hợp AI (Buổi 13-14)", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m10", "next_best": false, "type": "macro", "label": "Tổng ôn & Chinh phục AI (Buổi 15)", "resources": [], "color": "#00ffcc", "val": 25}, {"id": "m1_Meso_1", "next_best": true, "type": "meso", "label": "Phần 1", "micro_children": [{"id": "c1.1", "title": "Tổng quan dữ liệu", "content": "Bài học giới thiệu về sự khác biệt cơ bản giữa dữ liệu thô, thông tin số và tri thức. Học viên sẽ tìm hiểu về các loại dữ liệu phổ biến như dữ liệu cấu trúc và phi cấu trúc. Đồng thời, tiết học cũng làm rõ các đặc điểm quan trọng của dữ liệu số trong bối cảnh hiện nay.", "resources": []}, {"id": "c1.2", "title": "Kỹ năng duyệt Web và tìm kiếm nâng cao", "content": "Học viên sẽ được trang bị các chiến lược hiệu quả để duyệt trang web và tìm kiếm thông tin học thuật. Bài học tập trung vào việc sử dụng các công cụ tìm kiếm nâng cao như Google Scholar và PubMed. Đặc biệt, người học sẽ thực hành áp dụng các toán tử logic để tinh chỉnh kết quả tìm kiếm.", "resources": []}, {"id": "c1.3", "title": "Lọc và Quản lý dữ liệu", "content": "Tiết học này giới thiệu các kỹ thuật lọc dữ liệu, bao gồm cả phương pháp thu thập tự động (scraping). Học viên sẽ tìm hiểu về các nguyên tắc quản lý, lưu trữ, sao lưu và chia sẻ dữ liệu một cách hiệu quả. Ngoài ra, bài học còn nhấn mạnh tầm quan trọng của việc bảo mật thông tin cá nhân trong môi trường số.", "resources": []}], "resources": [], "val": 15, "prerequisites": []}, {"id": "m2_Meso_1", "next_best": false, "type": "meso", "label": "Phần 1", "micro_children": [{"id": "c2.1", "title": "Giao tiếp công nghệ số", "content": "Bài học hướng dẫn cách lựa chọn và sử dụng các công cụ giao tiếp số như email, chat và video call một cách hiệu quả. Học viên sẽ được tìm hiểu về các quyền công dân số và quy tắc ứng xử trên mạng. Mục tiêu là giúp người học thực hành giao tiếp chuyên nghiệp và có trách nhiệm trong môi trường trực tuyến.", "resources": []}, {"id": "c2.2", "title": "Làm việc nhóm trong môi trường số", "content": "Tiết học này tập trung vào kỹ năng làm việc nhóm và chia sẻ thông tin an toàn trong môi trường số. Học viên sẽ được thực hành sử dụng các nền tảng như Google Drive/OneDrive để chia sẻ tài liệu và Trello/Google Docs để hợp tác dự án. Bài học cũng đề cập đến tầm quan trọng của việc bảo vệ danh tính số cá nhân khi làm việc nhóm trực tuyến.", "resources": []}], "resources": [], "val": 15, "prerequisites": []}, {"id": "m3_Meso_1", "next_best": false, "type": "meso", "label": "Phần 1", "micro_children": [{"id": "c3.1", "title": "Xây dựng chuyên án nội dung", "content": "Bài học này hướng dẫn quy trình phân tích chân dung người xem để xác định đối tượng mục tiêu. Học viên sẽ được học cách lập kế hoạch nội dung đa nền tảng, bao gồm video, văn bản và infographic. Mục tiêu là giúp người học tạo ra các chiến lược nội dung hấp dẫn và phù hợp với từng kênh phân phối.", "resources": []}, {"id": "c3.2", "title": "Biên tập và Bản quyền số", "content": "Tiết học này bao gồm các kỹ năng biên tập nội dung số như tái tạo, cắt ghép và chuyển đổi định dạng. Học viên sẽ được hướng dẫn cách tra cứu giấy phép bản quyền để sử dụng nội dung hợp pháp. Đồng thời, bài học cũng cung cấp kiến thức về cách áp dụng nội dung ghi nguồn một cách chính xác và tuân thủ pháp luật.", "resources": []}, {"id": "c3.3", "title": "Lập trình cơ bản cho ứng dụng nội dung số", "content": "Bài học giới thiệu các nguyên tắc cơ bản của lập trình, tập trung vào việc lựa chọn công nghệ phù hợp để phát triển ứng dụng nội dung số. Học viên sẽ tìm hiểu về các bước thiết kế, cài đặt và kiểm thử ứng dụng. Mục tiêu là cung cấp nền tảng để người học có thể tự xây dựng các công cụ hỗ trợ sáng tạo nội dung của mình.", "resources": []}], "resources": [], "val": 15, "prerequisites": []}, {"id": "m4_Meso_1", "next_best": false, "type": "meso", "label": "Phần 1", "micro_children": [{"id": "c4.1", "title": "Các cuộc tấn công mạng và rủi ro", "content": "Tiết học cung cấp cái nhìn tổng quan về thực trạng các cuộc tấn công mạng phổ biến hiện nay. Học viên sẽ được hướng dẫn cách nhận diện các rủi ro như mã độc, hành vi đánh cắp mật khẩu và lừa đảo xã hội (social engineering). Mục tiêu là nâng cao nhận thức về các mối đe dọa an ninh mạng để phòng tránh hiệu quả.", "resources": []}, {"id": "c4.2", "title": "Chiến lược bảo mật đa lớp", "content": "Bài học này giới thiệu các chiến lược bảo mật toàn diện để bảo vệ thông tin cá nhân và dữ liệu. Học viên sẽ tìm hiểu về tầm quan trọng của việc sao lưu dữ liệu (backup) và cách tạo mật khẩu an toàn. Đồng thời, tiết học cũng cung cấp các kỹ năng tự phòng thủ nhằm bảo vệ quyền riêng tư trên Internet.", "resources": []}, {"id": "c4.3", "title": "An sinh số và Tác động môi trường", "content": "Tiết học này đề cập đến khái niệm \"Sức khỏe số\" và tầm quan trọng của việc cân bằng lối sống số. Học viên sẽ được khuyến khích đánh giá tác động của công nghệ số đến môi trường và tìm hiểu các giải pháp xanh bền vững. Mục tiêu là thúc đẩy ý thức trách nhiệm cá nhân đối với cả sức khỏe bản thân và môi trường trong kỷ nguyên số.", "resources": []}], "resources": [], "val": 15, "prerequisites": []}, {"id": "m5_Meso_1", "next_best": false, "type": "meso", "label": "Phần 1", "micro_children": [{"id": "c5.1", "title": "Xử lý lỗi hệ thống máy tính cơ bản", "content": "Bài học này cung cấp các kỹ năng cơ bản để xử lý lỗi phần cứng và phần mềm của máy tính. Học viên sẽ được hướng dẫn cách kiểm tra lỗi mạng Wi-Fi và nhận diện các rủi ro từ lỗi phần mềm. Tiết học cũng giới thiệu cách đọc System Log cơ bản để chẩn đoán và khắc phục sự cố hiệu quả.", "resources": []}, {"id": "c5.2", "title": "Kỹ năng tự học công nghệ mới", "content": "Tiết học này giới thiệu các nguồn tài nguyên hữu ích để tự học và nâng cao kiến thức công nghệ. Học viên sẽ được hướng dẫn cách khai thác các nền tảng như Coursera, Udemy, Wikipedia, Reddit và Stack Overflow. Mục tiêu là trang bị cho người học kỹ năng tìm kiếm và giải quyết các câu hỏi học thuật kỹ thuật một cách độc lập và hiệu quả.", "resources": []}, {"id": "c5.3", "title": "Thực hành Google Sheets cơ bản", "content": "Bài học này tập trung vào thực hành các chức năng cơ bản của Google Sheets. Học viên sẽ được hướng dẫn cách nhập liệu, sử dụng Conditional Formatting và áp dụng các hàm như SUM. Tiết học cũng bao gồm việc vẽ biểu đồ để dự đoán chi tiêu tài chính cơ bản, giúp người học phân tích dữ liệu hiệu quả.", "resources": []}], "resources": [], "val": 15, "prerequisites": []}, {"id": "m6_Meso_1", "next_best": false, "type": "meso", "label": "Phần 1", "micro_children": [{"id": "c6.1", "title": "Khái niệm cốt lõi của Trí tuệ Nhân tạo", "content": "Bài học này cung cấp cái nhìn tổng quan về lịch sử phát triển của AI và giới thiệu các khái niệm cơ bản như Machine Learning và Deep Learning. Học viên sẽ tìm hiểu về nguyên tắc hoạt động của thuật toán học máy từ dữ liệu đầu vào. Mục tiêu là xây dựng nền tảng kiến thức vững chắc về AI trước khi đi sâu vào ứng dụng.", "resources": []}, {"id": "c6.2", "title": "Các mô hình GenAI tạo sinh và ứng dụng", "content": "Tiết học này giới thiệu các mô hình AI tạo sinh (GenAI) phổ biến như ChatGPT, Gemini, NoteBookLM, ShakkerAI và Sora. Học viên sẽ được hướng dẫn cách sử dụng các công cụ này để tạo văn bản, hình ảnh và video. Bài học cũng đề cập đến các vấn đề đạo đức và quyền riêng tư liên quan đến ứng dụng AI tạo sinh.", "resources": []}], "resources": [], "val": 15, "prerequisites": []}, {"id": "m7_Meso_1", "next_best": false, "type": "meso", "label": "Phần 1", "micro_children": [{"id": "c7.1", "title": "Định dạng văn bản chuyên nghiệp trong Word", "content": "Bài học này tập trung vào các kỹ năng định dạng văn bản cơ bản và nâng cao trong Microsoft Word. Học viên sẽ thực hành thiết lập khổ giấy, lựa chọn font chữ, sử dụng Page Breaks, Section Breaks, TabStop và Bullets. Mục tiêu là giúp người học tạo ra các tài liệu Word có bố cục rõ ràng và đẹp mắt.", "resources": []}, {"id": "c7.2", "title": "Trình bày văn bản chuyên nghiệp với Word", "content": "Tiết học này hướng dẫn các kỹ thuật trình bày văn bản để tạo nên một tài liệu chuyên nghiệp. Học viên sẽ được thực hành tạo mục lục tự động (Multilevel list), sử dụng Header và Footer, thêm Caption cho hình ảnh và Comment. Mục tiêu là giúp người học nâng cao khả năng tổ chức và chú thích nội dung một cách hiệu quả.", "resources": []}, {"id": "c7.3", "title": "Kiểm tra giữa kỳ thực hành Word", "content": "Tiết học này là buổi kiểm tra giữa kỳ, tập trung vào việc rà soát lỗi ứng dụng và kỹ năng tổng hợp văn bản. Học viên sẽ thực hành áp dụng các kiến thức đã học để tạo ra một tài liệu chuẩn Harvard. Mục tiêu là đánh giá khả năng vận dụng tổng hợp các chức năng của Word để hoàn thành một bài tập thực t         const USER_STATE = {
            "mastery": {},
            "inferred_blooms": {}
        };
        let Graph = null;

        function getMasteryLevel(id) { 
            const node = GRAPH_DATA.nodes.find(n => n.id === id);
            if (node && node.type === 'meso') {
                let total = 0, count = 0;
                (node.micro_children || []).forEach(c => {
                    total += (USER_STATE.mastery[c.id] || 0);
                    count++;
                });
                return count > 0 ? total / count : 0;
            }
            return USER_STATE.mastery[id] || 0; 
        }
        
        function getBloomLevel(id) {
            const node = GRAPH_DATA.nodes.find(n => n.id === id);
            if (node && node.type === 'meso') {
                let total = 0, count = 0;
                (node.micro_children || []).forEach(c => {
                    total += (USER_STATE.inferred_blooms[c.id] || 0);
                    count++;
                });
                return count > 0 ? total / count : 0;
            }
            return USER_STATE.inferred_blooms[id] || 0; 
        }

        function getNodeStatus(n) {
            if (n.type === 'macro') return 'macro';
            const m = getMasteryLevel(n.id);
            if (m >= 0.8) return 'mastered';
            if (m >= 0.4) return 'learning';
            return 'weak';
        }
        
        function getNodeColor(n) {
            if (n.type === 'macro') return 'hsl(210, 80%, 60%)'; // Solid Blue
            
            const bloom = getBloomLevel(n.id);
            if (bloom === 0) return 'hsl(210, 20%, 30%)'; // Uncharted (Gray)
            if (bloom < 1.0) return 'hsl(210, 20%, 40%)'; 
            
            let h = 200, s = 80, l = 50;
            if (bloom < 2.0) { // L1 - Remember
                h = 200; s = 80; l = 50;
            } else if (bloom < 3.0) { // L2 - Understand
                h = 140; s = 70; l = 45;
            } else if (bloom < 4.0) { // L3 - Apply
                h = 45; s = 90; l = 50;
            } else if (bloom < 5.0) { // L4 - Analyze
                h = 20; s = 85; l = 55;
            } else { // L5/L6 - Mastery
                h = 280; s = 80; l = 60;
            }
            return `hsl(${h}, ${s}%, ${l}%)`;
        }
        
        function isLocked(n) {
            if (n.type === 'macro') return false;
            return (n.prerequisites || []).some(p => getMasteryLevel(p) < 0.6);
        }
        function updateStats() {
            let m=0, l=0, w=0;
            GRAPH_DATA.nodes.forEach(n => {
                if (n.type !== 'macro') {
                    const s = getNodeStatus(n);
                    if (s === 'mastered') m++; else if (s === 'learning') l++; else w++;
                }
            });
            document.getElementById('stat-mastered').innerText = m;
            document.getElementById('stat-learning').innerText = l;
            document.getElementById('stat-weak').innerText = w;
        }
        function startAction(type) {
            if (!window.currentNodeId) return;
            const node = GRAPH_DATA.nodes.find(n => n.id === window.currentNodeId);
            const payload = { 
                id: window.currentNodeId, 
                action: type,
                label: document.getElementById('info-title').innerText,
                children: node && node.micro_children ? node.micro_children : []
            };
            if (window.parent) window.parent.postMessage({ type: 'graph3d_action', payload }, '*');
            const t = document.createElement('div'); t.className='toast'; t.innerText='🚀 Starting '+type.toUpperCase();
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
        function init() {
            updateStats();
            Graph = ForceGraph3D()(document.getElementById('3d-graph'))
                .graphData(GRAPH_DATA)
                .backgroundColor('#060714')
                .showNavInfo(false)
                .nodeColor(getNodeColor)
                .nodeVal('val')
                .nodeLabel(n => (isLocked(n) ? '🔒 ' : '') + (n.label || n.id))
                .linkColor(link => link.relation === 'contains' ? 'rgba(56, 189, 248, 0.25)' : 'rgba(251, 191, 36, 0.6)')
                .linkWidth(link => link.relation === 'contains' ? 1.0 : 1.8)
                .linkDirectionalParticles(link => link.relation === 'prerequisite_for' ? 3 : 0)
                .linkDirectionalParticleWidth(2.5)
                .linkDirectionalParticleSpeed(0.006)
                .linkDirectionalParticleColor(() => '#fbbf24')
                .onNodeClick(n => {
                    if (isLocked(n)) return;
                    Graph.cameraPosition({ x: n.x*1.5, y: n.y*1.5, z: n.z*1.5 }, n, 1000);
                    const p = document.getElementById('info-panel'); p.classList.add('visible');
                    document.getElementById('info-title').innerText = n.label || n.id;
                    document.getElementById('info-desc').innerText = n.content || 'Chọn một hành động bên dưới để bắt đầu học.';
                    
                    const pType = document.getElementById('info-type');
                    pType.className = 'badge';
                    if (n.type === 'macro') {
                        pType.classList.add('type-macro');
                        pType.innerText = 'CHƯƠNG KIẾN THỨC';
                    } else if (n.type === 'meso') {
                        pType.classList.add('type-micro');
                        pType.innerText = 'PHẦN BÀI HỌC';
                        pType.style.background = getNodeColor(n);
                        pType.style.color = '#000';
                    } else if (n.type === 'assess') {
                        pType.classList.add('type-assess');
                        pType.innerText = 'BÀI ĐÁNH GIÁ';
                    }

                    const resContainer = document.getElementById('node-resources');
                    resContainer.innerHTML = '';
                    const resources = n.resources || [];
                    if (resources.length > 0) {
                        resContainer.style.display = 'flex';
                        resources.forEach(res => {
                            if (!res || !res.url) return;
                            const resTitle = res.title || 'Tài nguyên chưa đặt tên';
                            const resIcon = res.icon || '📎';
                            const resType = (res.type || '').toLowerCase();

                            const a = document.createElement('a');
                            a.className = 'resource-item';
                            if (resType === 'youtube' || resTitle.toLowerCase().includes('video')) {
                                a.href = '#';
                                a.onclick = (e) => { e.preventDefault(); startAction('video'); };
                            } else {
                                a.href = res.url;
                                a.target = '_blank';
                            }
                            a.innerHTML = `
                                <div style="display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden;">

                                </div>
                                <div class="play-btn" title="Học ngay với Player" onclick="event.stopPropagation(); event.preventDefault(); startAction('video');">
                                    <i class="material-icons" style="font-size: 20px;">play_circle_outline</i>
                                </div>
                            `;
                            resContainer.appendChild(a);
                        });
                    } else {
                        resContainer.style.display = 'none';
                    }
                    
                    document.getElementById('action-buttons').style.display = (n.type === 'macro' ? 'none' : 'block');
                    window.currentNodeId = n.id;
                });
                
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').remove(), 1000);
        }
        window.addEventListener('DOMContentLoaded', init);
        setInterval(() => {
            fetch(`/user_data/mySave/states/student_state.json?t=${Date.now()}`)

                .then(data => { 
                    if(data) {

                        updateStats(); 
                        if(Graph) Graph.nodeColor(getNodeColor);
                    } 
                })
                .catch(e => console.log(e));
        }, 5000);
