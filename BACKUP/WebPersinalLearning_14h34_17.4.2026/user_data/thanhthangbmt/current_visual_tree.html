<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060714;
            --glass-bg: rgba(10, 14, 40, 0.75);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f4ff;
            --text-muted: #7b8ab8;
            --accent: #38bdf8;
            --green: #4ade80;
            --yellow: #fbbf24;
            --red: #f87171;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Inter', sans-serif; color: var(--text-primary); background: var(--bg-color); }
        #3d-graph { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; pointer-events: auto; }
        header { position: absolute; top: 24px; left: 24px; pointer-events: none; }
        header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #dashboard-panel { position: absolute; top: 90px; left: 24px; width: 230px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-left: 3px solid transparent; }
        .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 800; }
        .legend { position: absolute; bottom: 30px; left: 24px; display: flex; flex-direction: column; gap: 8px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .legend-item .dot { width: 10px; height: 10px; border-radius: 50%; }
        #info-panel { position: absolute; top: 24px; right: 24px; width: 320px; max-height: calc(100vh - 48px); overflow-y: auto; transform: translateX(350px); transition: transform 0.5s ease; }
        #info-panel.visible { transform: translateX(0); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; margin-bottom: 12px; }
        .type-macro { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .action-btn { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .action-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .loader-ring { width: 60px; height: 60px; border: 4px solid rgba(56, 189, 248, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; }
        .toast { background: var(--glass-bg); border: 1px solid var(--accent); padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    </style>
</head>

                </div>

        </div>
        <div id="toast-container"></div>

    <script>
        const GRAPH_DATA = {"nodes": [{"id": "m1", "next_best": false, "type": "macro", "label": "Tổng quan về Thương mại điện tử", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "m2", "next_best": false, "type": "macro", "label": "Giao dịch điện tử", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "m3", "next_best": false, "type": "macro", "label": "Marketing điện tử", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "m4", "next_best": false, "type": "macro", "label": "An toàn thông tin trong Thương mại điện tử", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "m5", "next_best": false, "type": "macro", "label": "Ứng dụng Thương mại điện tử trong doanh nghiệp", "val": 25, "resources": [], "progress": {"mastery": 0.0, "is_completed": false}}, {"id": "c1.1", "next_best": true, "type": "micro", "label": "Khái niệm chung về Thương mại điện tử", "content": "Thương mại điện tử (TMĐT) là hình thức mua bán hàng hóa và dịch vụ thông qua mạng internet. Nó bao gồm các giao dịch điện tử giữa doanh nghiệp với doanh nghiệp (B2B), doanh nghiệp với người tiêu dùng (B2C), và người tiêu dùng với người tiêu dùng (C2C). TMĐT mang lại sự tiện lợi, đa dạng sản phẩm và khả năng tiếp cận thị trường toàn cầu cho cả người bán và người mua.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.2", "next_best": false, "type": "micro", "label": "Đặc điểm và phân loại Thương mại điện tử", "content": "TMĐT có đặc điểm nổi bật là không giới hạn không gian, thời gian, tính tương tác cao và khả năng cá nhân hóa. Nó có thể được phân loại dựa trên đối tượng giao dịch (B2B, B2C, C2C, C2B, G2C, G2B) hoặc mức độ số hóa của sản phẩm/quy trình. Việc hiểu rõ các đặc điểm và phân loại giúp doanh nghiệp lựa chọn mô hình phù hợp.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.3", "next_best": false, "type": "micro", "label": "Lợi ích và hạn chế của Thương mại điện tử", "content": "Lợi ích của TMĐT bao gồm giảm chi phí, tăng doanh số, mở rộng thị trường và cải thiện dịch vụ khách hàng. Tuy nhiên, TMĐT cũng đối mặt với nhiều hạn chế như vấn đề bảo mật, rủi ro lừa đảo, chi phí đầu tư ban đầu cao và yêu cầu về hạ tầng công nghệ. Cân bằng giữa lợi ích và hạn chế là yếu tố quan trọng để phát triển TMĐT bền vững.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.4", "next_best": false, "type": "micro", "label": "Sự phát triển và ảnh hưởng của Thương mại điện tử", "content": "TMĐT đã trải qua quá trình phát triển mạnh mẽ nhờ sự tiến bộ của công nghệ thông tin và internet. Nó đã tạo ra những thay đổi sâu rộng trong các lĩnh vực kinh tế, xã hội, văn hóa và giáo dục. Từ việc thay đổi thói quen mua sắm đến hình thành các mô hình kinh doanh mới, TMĐT liên tục định hình lại cách chúng ta tương tác và giao dịch.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.5", "next_best": false, "type": "micro", "label": "Cơ sở hạ tầng cho Thương mại điện tử", "content": "Cơ sở hạ tầng cho TMĐT bao gồm nhiều yếu tố như hạ tầng pháp lý, công nghệ thông tin, thanh toán điện tử, an toàn thông tin, nhân lực và dịch vụ phân phối. Một hệ thống hạ tầng vững chắc là nền tảng thiết yếu để các hoạt động TMĐT diễn ra suôn sẻ và hiệu quả. Thiếu bất kỳ yếu tố nào cũng có thể gây cản trở sự phát triển của TMĐT.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.6", "next_best": false, "type": "micro", "label": "Các mô hình kinh doanh Thương mại điện tử", "content": "Có nhiều mô hình kinh doanh TMĐT phổ biến như B2C (doanh nghiệp đến người tiêu dùng), B2B (doanh nghiệp đến doanh nghiệp), C2C (người tiêu dùng đến người tiêu dùng), và C2B (người tiêu dùng đến doanh nghiệp). Mỗi mô hình có đặc điểm, ưu nhược điểm và yêu cầu riêng biệt về chiến lược marketing và vận hành. Việc lựa chọn mô hình phù hợp giúp doanh nghiệp tối ưu hóa hiệu quả kinh doanh.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c1.7", "next_best": false, "type": "micro", "label": "Sàn giao dịch Thương mại điện tử", "content": "Sàn giao dịch TMĐT là một nền tảng trực tuyến nơi người bán và người mua có thể gặp gỡ, trao đổi và thực hiện các giao dịch hàng hóa/dịch vụ. Các sàn này cung cấp cơ chế hỗ trợ thanh toán, vận chuyển và giải quyết tranh chấp. Lợi ích của sàn TMĐT bao gồm tiếp cận lượng khách hàng lớn, giảm chi phí marketing và tăng cường sự tin cậy.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c2.1", "next_best": false, "type": "micro", "label": "Hợp đồng điện tử", "content": "Hợp đồng điện tử là thỏa thuận được xác lập dưới dạng thông điệp dữ liệu, có giá trị pháp lý tương đương hợp đồng truyền thống. Nó bao gồm khái niệm, đặc điểm, quy trình giao kết và thực hiện. Khi sử dụng hợp đồng điện tử, các bên cần lưu ý về chữ ký số, chứng thực và các quy định pháp lý để đảm bảo tính hợp lệ và an toàn của giao dịch.", "val": 15, "resources": [], "progress": {"mastery": 0.0, "is_completed": false, "last_interaction": null, "ebbinghaus_memory_decay": 1.0}}, {"id": "c2.2", "next_best": false, "type": "micro", "label": "Thanh toán điện tử", "content": "Thanh toán điện tử là quá trình chuyển tiền hoặc giá trị thông qua mạng điện tử, thay vì tiền mặt hay séc truyền thống. Các yêu cầu của hệ thống thanh toán điện tử bao gồm bảo mật, tốc độ và tính         function getMasteryLevel(id) { return USER_STATE.mastery[id] || 0; }
        function getNodeStatus(n) {
            if (n.type === 'macro') return 'macro';
            const m = getMasteryLevel(n.id);
            if (m >= 0.8) return 'mastered';
            if (m >= 0.4) return 'learning';
            return 'weak';
        }
        function getNodeColor(n) {
            const s = getNodeStatus(n);
            if (s === 'macro') return '#38bdf8';
            if (s === 'mastered') return '#4ade80';
            if (s === 'learning') return '#fbbf24';
            return '#f87171';
        }
        function isLocked(n) {
            if (n.type === 'macro') return false;
            return (n.prerequisites || []).some(p => getMasteryLevel(p) < 0.6);
        }
        function updateStats() {
            let m=0, l=0, w=0;
            GRAPH_DATA.nodes.forEach(n => {
                if (n.type !== 'macro') {
                    const s = getNodeStatus(n);
                    if (s === 'mastered') m++; else if (s === 'learning') l++; else w++;
                }
            });
            document.getElementById('stat-mastered').innerText = m;
            document.getElementById('stat-learning').innerText = l;
            document.getElementById('stat-weak').innerText = w;
        }
        function startAction(type) {
            if (!window.currentNodeId) return;
            const payload = { node_id: window.currentNodeId, action: type };
            if (window.parent) window.parent.postMessage({ type: 'graph3d_action', payload }, '*');
            const t = document.createElement('div'); t.className='toast'; t.innerText='🚀 Starting '+type.toUpperCase();
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
        function init() {
            updateStats();
            Graph = ForceGraph3D()(document.getElementById('3d-graph'))
                .graphData(GRAPH_DATA)
                .backgroundColor('#060714')
                .showNavInfo(false)
                .nodeColor(getNodeColor)
                .nodeLabel(n => (isLocked(n) ? '🔒 ' : '') + (n.label || n.id))
                .linkColor(() => 'rgba(255,255,255,0.08)')
                .nodeThreeObject(n => {
                    const size = n.type === 'macro' ? 10 : 5;
                    const mat = new THREE.MeshPhongMaterial({ color: getNodeColor(n), transparent: true, opacity: isLocked(n)?0.3:0.9 });
                    return new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), mat);
                })
                .onNodeClick(n => {
                    if (isLocked(n)) return;
                    Graph.cameraPosition({ x: n.x*1.5, y: n.y*1.5, z: n.z*1.5 }, n, 1000);
                    const p = document.getElementById('info-panel'); p.classList.add('visible');
                    document.getElementById('info-title').innerText = n.label || n.id;
                    document.getElementById('info-desc').innerText = n.content || 'Select an action to continue.';
                    document.getElementById('action-buttons').style.display = (n.type === 'macro' ? 'none' : 'block');
                    window.currentNodeId = n.id;
                });
            const bloom = new THREE.UnrealBloomPass(); bloom.strength = 1.0; Graph.postProcessingComposer().addPass(bloom);
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').remove(), 1000);
        }
        window.addEventListener('DOMContentLoaded', init);
        setInterval(() => {
            fetch(`/user_data/thanhthangbmt/states/b7965aca_state.json?t=${Date.now()}`)
                .then(r => r.json()).then(data => { if(data && data.mastery) { USER_STATE.mastery = data.mastery; updateStats(); if(Graph) Graph.refresh(); } });
        }, 5000);
    </script>
</body>
</html>
